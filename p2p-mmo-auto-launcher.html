<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PSSF Auto Network Lab</title>
<style>
html,body{margin:0;background:#080c0f;color:#d9e3ea;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
header{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#0d1318;border-bottom:1px solid #26313b}
b{color:#3ddc97}.muted{color:#80919d;font-size:12px}
button{background:#121a21;color:#d9e3ea;border:1px solid #32404b;border-radius:4px;padding:6px 10px;cursor:pointer}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:8px;padding:8px}
.frame{height:360px;border:1px solid #26313b;background:#05080a;display:flex;flex-direction:column}
.badge{height:28px;box-sizing:border-box;padding:6px 8px;border-bottom:1px solid #26313b;color:#a9bac5;font-size:12px}
.badge strong{color:#f5c451}
iframe{width:100%;flex:1;border:0}
</style>
</head>
<body>
<header>
  <b id="summary">AUTO NETWORK LAB</b>
  <span class="muted" id="detail"></span>
  <button onclick="location.reload()">restart all</button>
</header>
<div id="grid"></div>
<script>
'use strict';
const p=new URLSearchParams(location.search);
const count=Math.max(1,Math.min(16,Number(p.get('count')||3)|0));
const room=p.get('room')||'test1';
const signal=p.get('signal')||'wss://p2p-realtime-test.onrender.com';
const aoi=p.get('aoi')||'260';
const client=p.get('client')||'p2p-mmo-demo-auto.html';
const launchGap=Math.max(0,Number(p.get('launchGap')||900));
const build='pssf-v13-r24';

// 기본값부터 의도적으로 고핑이다.
// ping= 을 주면 전 peer 고정, 아니면 pingMin~pingMax 사이에서 peer마다 다르게 뽑는다.
const fixedPing=p.has('ping')?Math.max(0,Number(p.get('ping'))||0):null;
const pingMin=Math.max(0,Number(p.get('pingMin')||160));
const pingMax=Math.max(pingMin,Number(p.get('pingMax')||320));
const jitter=Math.max(0,Number(p.get('jitter')||45));
const loss=Math.max(0,Number(p.get('loss')||1.5));
const drop=Math.max(0,Number(p.get('drop')||0));
const spike=Math.max(0,Number(p.get('spike')||4));
const spikeMs=Math.max(0,Number(p.get('spikeMs')||280));
const retransmit=p.get('retransmit');
const netem=p.get('netem');

const grid=document.getElementById('grid');
const profile=/^(0|false|off|no)$/i.test(netem||'')?'NETEM OFF':(fixedPing!==null?`RTT ${fixedPing}ms fixed`:`RTT ${pingMin}~${pingMax}ms`);
document.getElementById('summary').textContent=`AUTO × ${count}`;
document.getElementById('detail').textContent=`build=${build} · room=${room} · ${profile} · jitter±${jitter} · loss ${loss}% · spike ${spike}%/+${spikeMs}ms · launchGap ${launchGap}ms`;

function peerPing(){
    if(fixedPing!==null) return fixedPing;
    return Math.round(pingMin+Math.random()*(pingMax-pingMin));
}

for(let i=0;i<count;i++){
    const ping=peerPing();
    const wrap=document.createElement('div');
    wrap.className='frame';

    const badge=document.createElement('div');
    badge.className='badge';
    badge.innerHTML=`AUTO ${String(i+1).padStart(2,'0')} · <strong>RTT~${ping}ms</strong> · jitter±${jitter} · loss ${loss}% · spike ${spike}%`;
    wrap.appendChild(badge);

    const frame=document.createElement('iframe');
    const q=new URLSearchParams({
        signal,room,aoi,auto:'1',
        ping:String(ping),
        jitter:String(jitter),
        loss:String(loss),
        drop:String(drop),
        spike:String(spike),
        spikeMs:String(spikeMs)
    });
    if(retransmit!=null) q.set('retransmit',retransmit);
    if(netem!=null) q.set('netem',netem);
    frame.loading='eager';
    wrap.appendChild(frame);
    grid.appendChild(wrap);
    setTimeout(()=>{
        badge.dataset.base=badge.innerHTML;
        frame.src=`${client}?${q.toString()}&launcherIndex=${i+1}&build=${encodeURIComponent(build)}`;
    }, i*launchGap);
}

window.addEventListener('message',event=>{
    const data=event.data;
    if(!data||data.type!=='pssf-auto-status') return;
    const frames=[...document.querySelectorAll('iframe')];
    const idx=frames.findIndex(f=>f.contentWindow===event.source);
    if(idx<0) return;
    const badge=frames[idx].previousElementSibling;
    const base=badge?.dataset?.base||badge?.innerHTML||`AUTO ${String(idx+1).padStart(2,'0')}`;
    const direct=Number(data.direct)||0, desired=Number(data.desired)||0;
    badge.innerHTML=`${base.split(' · mesh ')[0]} · mesh <strong>${direct}/${desired}</strong>`;
});
</script>
</body>
</html>
